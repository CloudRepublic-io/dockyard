<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dockyard{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Applied synchronously, before anything paints, so there's no flash of
    // the wrong theme on load.
    (function () {
      try {
        if (localStorage.getItem('dockyard-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* localStorage unavailable - just default to dark */ }
    })();
  </script>
</head>
<body>
  <header class="yard-header">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 32 32" width="22" height="22">
        <rect x="6" y="6" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2.6"/>
        <line x1="6" y1="16" x2="26" y2="16" stroke="currentColor" stroke-width="2.6"/>
        <circle cx="9" cy="9" r="1.4" fill="currentColor"/>
        <circle cx="23" cy="9" r="1.4" fill="currentColor"/>
        <circle cx="9" cy="23" r="1.4" fill="currentColor"/>
        <circle cx="23" cy="23" r="1.4" fill="currentColor"/>
      </svg>
      <span class="brand-text">DOCKYARD</span>
      <span class="brand-sub">container manifest &amp; docs</span>
    </a>
    <form class="search-form" id="filter-form" action="/" method="get">
      <div class="search-input-wrap">
        <input type="text" id="search-input" name="q" placeholder="Search name, image, tags&hellip;" value="{{ q|default('') }}">
        <button type="button" id="search-clear" class="search-clear-btn" aria-label="Clear search">&times;</button>
      </div>
      {% if all_hosts is defined and all_hosts|length > 1 %}
      <select name="host" id="host-select">
        <option value="" {% if not host %}selected{% endif %}>all hosts</option>
        {% for h in all_hosts %}
        <option value="{{ h }}" {% if host==h %}selected{% endif %}>{{ h }}</option>
        {% endfor %}
      </select>
      {% endif %}
    </form>

    <div class="menu-dropdown">
      <button class="sync-btn menu-trigger" id="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="menu-panel" id="menu-panel">
        <form action="/sync" method="post" class="menu-item-form" id="sync-form">
          <button class="menu-item" type="submit" id="sync-button" title="Re-scan Docker socket &amp; compose files">
            <span class="menu-item-icon" id="sync-icon">&#8635;</span> <span id="sync-label">Sync</span>
          </button>
        </form>
        <a class="menu-item" href="/export" title="Download a single Markdown file with every container's manifest &amp; notes">
          <span class="menu-item-icon">&#8615;</span> Export
        </a>
        <a class="menu-item" href="/archive">
          <span class="menu-item-icon">&#128451;</span> Archive
        </a>
        <a class="menu-item" href="/guide">
          <span class="menu-item-icon">&#128214;</span> Guide
        </a>
        <button class="menu-item" id="theme-toggle" type="button">
          <span class="menu-item-icon" id="theme-icon">&#9728;</span>
          <span id="theme-label">Light mode</span>
        </button>
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="yard-footer">
    <span>Dockyard &mdash; auto-pulled facts from the Docker socket &amp; compose files, notes written by you.</span>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var themeToggle = document.getElementById('theme-toggle');
      var themeLabel = document.getElementById('theme-label');
      var themeIcon = document.getElementById('theme-icon');
      var menuTrigger = document.getElementById('menu-trigger');
      var menuPanel = document.getElementById('menu-panel');
      var syncForm = document.getElementById('sync-form');
      var syncButton = document.getElementById('sync-button');
      var syncIcon = document.getElementById('sync-icon');
      var syncLabel = document.getElementById('sync-label');

      function currentTheme() {
        return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      }

      function reflectTheme(theme) {
        // The label/icon describe what clicking will switch TO, not the
        // currently active theme - e.g. while dark is showing, this should
        // read "Light mode" (an invitation to switch to light).
        var target = theme === 'light' ? 'dark' : 'light';
        if (themeLabel) themeLabel.textContent = target === 'light' ? 'Light mode' : 'Dark mode';
        if (themeIcon) themeIcon.innerHTML = target === 'light' ? '&#9728;' : '&#9789;';
      }

      reflectTheme(currentTheme());

      if (themeToggle) {
        themeToggle.addEventListener('click', function () {
          var next = currentTheme() === 'light' ? 'dark' : 'light';
          if (next === 'light') {
            root.setAttribute('data-theme', 'light');
          } else {
            root.removeAttribute('data-theme');
          }
          try { localStorage.setItem('dockyard-theme', next); } catch (e) { /* ignore */ }
          reflectTheme(next);
        });
      }

      if (menuTrigger && menuPanel) {
        menuTrigger.addEventListener('click', function (e) {
          e.stopPropagation();
          var isOpen = menuPanel.classList.toggle('open');
          menuTrigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });
        document.addEventListener('click', function (e) {
          if (!menuPanel.contains(e.target) && e.target !== menuTrigger) {
            menuPanel.classList.remove('open');
            menuTrigger.setAttribute('aria-expanded', 'false');
          }
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            menuPanel.classList.remove('open');
            menuTrigger.setAttribute('aria-expanded', 'false');
          }
        });
      }

      // "Back to all containers" links always go straight to the main page
      // (never via browser history), re-applying whatever search/filter state
      // was last active there. This only applies to links that actually point
      // at the main page - other "back" links (e.g. edit.html's "back to
      // this container") should just navigate normally to their own href.
      document.querySelectorAll('.back-link').forEach(function (link) {
        link.addEventListener('click', function (e) {
          var linkUrl = new URL(link.href, window.location.origin);
          if (linkUrl.pathname !== '/') return; // not an "all containers" link - leave it alone
          e.preventDefault();
          var query = '';
          try { query = sessionStorage.getItem('dockyard-last-index-query') || ''; } catch (err) { /* ignore */ }
          window.location.href = '/' + (query ? ('?' + query) : '');
        });
      });

      if (syncForm && syncButton) {
        syncForm.addEventListener('submit', function () {
          syncButton.disabled = true;
          syncButton.classList.add('syncing');
          if (syncIcon) syncIcon.innerHTML = '<span class="spinner spinner-inline"></span>';
          if (syncLabel) syncLabel.textContent = 'Syncing\u2026';
        });
      }

      // Launch-button port-picker dropdowns (card grid + detail page).
      // Delegated on document rather than attached per-element, since the
      // card grid gets replaced wholesale via AJAX on every filter change -
      // direct listeners on individual cards wouldn't survive that.
      function closeAllLaunchPanels() {
        document.querySelectorAll('.launch-dropdown-panel.open').forEach(function (p) {
          p.classList.remove('open');
        });
      }
      document.addEventListener('click', function (e) {
        var trigger = e.target.closest('[data-launch-trigger]');
        if (trigger) {
          e.preventDefault();
          e.stopPropagation();
          var panel = trigger.parentElement.querySelector('.launch-dropdown-panel');
          var wasOpen = panel.classList.contains('open');
          closeAllLaunchPanels();
          if (!wasOpen) panel.classList.add('open');
          return;
        }
        var option = e.target.closest('.launch-option');
        if (option) {
          e.preventDefault();
          e.stopPropagation();
          var url = option.getAttribute('data-url');
          var port = option.getAttribute('data-port');
          var target = url ? url : ('http://' + window.location.hostname + ':' + port);
          window.open(target, '_blank', 'noopener');
          closeAllLaunchPanels();
          return;
        }
        closeAllLaunchPanels();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeAllLaunchPanels();
      });
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
