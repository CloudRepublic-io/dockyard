services:
  # Restricts what Dockyard can do with the Docker API: read-only, containers only.
  # This is the recommended way to hand a container access to the socket, since a
  # plain read-only bind mount of docker.sock does NOT limit the API calls that can
  # be made through it - the proxy actually enforces the restriction.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"     # allow GET /containers
      IMAGES: "1"         # allow GET /images
      NETWORKS: "1"       # allow GET /networks
      VOLUMES: "1"        # allow GET /volumes
      POST: "0"           # block all writes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockyard-internal

  dockyard:
    build: .
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    # Dockyard reads these same keys off every container it watches - so this
    # documents Dockyard itself, automatically, the moment it starts. Update
    # the documentation URL below to match your actual host/port once deployed.
    labels:
    # traefik labels
      # - "traefik.enable=true"
      # - "traefik.http.routers.dockyard.rule=Host(`dockyard.<YOUR_DOMAIN>.`)"
      # - "traefik.http.routers.dockyard.entrypoints=web"
      # - "traefik.http.routers.dockyard-https.tls=true"
      # - "traefik.http.routers.dockyard-https.tls.certresolver=cloudflare"
      # - "traefik.http.routers.dockyard-https.entrypoints=websecure"
      # - "traefik.http.routers.dockyard-https.rule=Host(`dockyard.<YOUR_DOMAIN>`)"
      # - "traefik.docker.network=frontend"
      - "org.opencontainers.image.title: Dockyard"
      - "org.opencontainers.image.description: Documentation dashboard for this server's Docker containers - auto-pulls facts from the Docker API and compose files; notes are yours to write."
      - "org.opencontainers.image.documentation: http://localhost:8088/guide"
      - "org.label-schema.usage: Open the Guide page in the Dockyard UI, or run: docker compose logs dockyard"
      - "dockyard.tags: meta,infrastructure"
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      DOCKYARD_COMPOSE_DIR: /compose
      DOCKYARD_DATA_DIR: /app/data
      DOCKYARD_SYNC_INTERVAL: "300"
      # Uncomment and edit to turn Dockyard into a centralized dashboard for
      # multiple servers. Each entry needs a Docker API reachable from this
      # container - see the README's "Multi-host" section for how to expose
      # that safely (docker-socket-proxy per remote host, kept LAN/VPN-only).
      # Leave this unset and Dockyard behaves exactly as a single local host.
      DOCKYARD_HOSTS: []
      # DOCKYARD_HOSTS: >
        # [
            # {"name": "prod-server", "docker_url": "tcp://192.168.1.60:2375"},
            # {"name": "qa-server", "docker_url": "tcp://192.168.1.50:2375"},
            # {"name": "dev-server", "docker_url": "tcp://192.168.1.40:2375", "compose_dir": "/home/dev/docker"}
        # ]

      # Uncomment to require HTTP Basic Auth on every page (recommended if this
      # is reachable beyond your LAN). Leave both unset to disable auth.
      # DOCKYARD_AUTH_USER: "admin"
      # DOCKYARD_AUTH_PASS: "change-me"

      # Required only if you're using the compose-push agent (see agent/) for
      # hosts whose compose directory Dockyard can't reach directly. Pick a
      # long random value and use the exact same one in each agent's config.
      DOCKYARD_INGEST_TOKEN: "<SET A LONG RANDOM SECRET HERE>"

      # Uncomment to let Dockyard write a short summary/tags back into your
      # docker-compose.yml files as labels. Also requires changing the compose
      # volume mount below from :ro to read-write.
      # DOCKYARD_ALLOW_COMPOSE_WRITE: "true"
    volumes:
      # Point this at the directory (or parent directory) that holds your
      # docker-compose.yml files, read-only (e.g. /home/admin/docker).
      - /srv/docker:/compose:ro
      # Persists the SQLite database (your notes) across restarts/rebuilds.
      - ./data:/app/data
      # Comment the ports out if you want to run Dockyard behind a reverse proxy (Traefik, Nginx, etc.) instead of exposing it directly.
    ports:
     - "8088:8000"
    networks:
      - dockyard-internal
      # Uncomment the next line if you want to run Dockyard behind a reverse proxy (Traefik, Nginx, etc.) instead of exposing it directly.
      # - frontend

networks:
  dockyard-internal:
  # Uncomment the next section if you want to run Dockyard behind a reverse proxy (Traefik, Nginx, etc.) instead of exposing it directly.
  # Change the "frontend" line to match your actual frontend network name if it's different.
  # frontend:
  #   external: true
